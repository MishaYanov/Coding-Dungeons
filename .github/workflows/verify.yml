name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FERRUM_REQUIRE_RUSTC: "1"
      FERRUM_REQUIRE_GO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-book.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-book.txt
          rustup show
      - name: Check npm advisories
        run: npm audit --audit-level=high
      - name: Test the reader
        run: npm test
      - name: Test browser journeys
        run: |
          npx playwright-core install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FERRUM_BROWSER = node -p "require('playwright-core').chromium.executablePath()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run mobile:stage-rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FERRUM_MOBILE_REQUIRE_RUST = '1'
          npm run test:mobile:rust
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:mobile
      - name: Test packaged Windows desktop
        env:
          FERRUM_DESKTOP_TEST_PACKAGE: "1"
        run: |
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
      - name: Run Rust examples
        run: npm run test:book
      - name: Check book assets
        run: python verify-worlds.py --check-typescript
