name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FERRUM_REQUIRE_RUSTC: "1"
      FERRUM_REQUIRE_GO: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-book.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache: false
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-book.txt
          rustup show
      - name: Test the reader
        run: npm test
      - name: Test browser journeys
        run: |
          npx playwright-core install chromium
          npm run test:browser
      - name: Run Rust examples
        run: npm run test:book
      - name: Check book assets
        run: python verify-worlds.py
